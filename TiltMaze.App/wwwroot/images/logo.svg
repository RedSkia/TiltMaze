<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TiltMaze">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16223f"/>
      <stop offset="1" stop-color="#0a1124"/>
    </linearGradient>
    <linearGradient id="wall" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2de2c8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff1e0"/>
      <stop offset="0.45" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#d9480f"/>
    </radialGradient>
  </defs>
  <!-- flise -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#tile)"/>
  <!-- labyrint: ramme og tre vægge, med mørk side under -->
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#0b5f63" transform="translate(0 2)">
      <rect x="10" y="10" width="44" height="44" rx="6"/>
      <path d="M10 26H38 M26 40H54 M38 26V33"/>
    </g>
    <g stroke="url(#wall)">
      <rect x="10" y="10" width="44" height="44" rx="6"/>
      <path d="M10 26H38 M26 40H54 M38 26V33"/>
    </g>
  </g>
  <!-- mål (guld) og kuglen (orange) -->
  <circle cx="46" cy="18" r="4" fill="none" stroke="#ffc857" stroke-width="2.5"/>
  <ellipse cx="19.5" cy="49" rx="5.5" ry="2.5" fill="#000" fill-opacity="0.35"/>
  <circle cx="18" cy="46.5" r="5.5" fill="url(#ball)"/>
</svg>
