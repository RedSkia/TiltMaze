# Starter API'et: docker compose up -d
# Adresse: https://localhost:7065 (samme som under udvikling, så appen ikke skal ændres)
services:
  api:
    build:
      context: .
      dockerfile: TiltMaze.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "7065:8443"
    environment:
      ASPNETCORE_URLS: "https://+:8443"
      ASPNETCORE_HTTPS_PORTS: "7065"
      ConnectionStrings__TiltMaze: "Data Source=/data/tiltmaze.db"
      # Nøgler til login-tokens ligger i volumen, så brugerne ikke logges ud ved ny container
      DataProtection__KeysPath: "/data/keys"
      # Udviklingscertifikat til HTTPS. Kodeordet ligger i .env (kommer ikke i git)
      Kestrel__Certificates__Default__Path: "/https/tiltmaze.pfx"
      Kestrel__Certificates__Default__Password: "${CERT_PASSWORD:?Mangler CERT_PASSWORD i .env}"
    volumes:
      - tiltmaze-data:/data
      # Mappen med tiltmaze.pfx. Standard er ASP.NET-mappen; sæt CERT_DIR i .env for en anden
      - ${CERT_DIR:-${USERPROFILE}/.aspnet/https}:/https:ro

volumes:
  tiltmaze-data:
